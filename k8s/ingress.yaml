apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workshop-app
  namespace: dev
  labels:
    app.kubernetes.io/name: workshop-app
  annotations:
    tailscale.com/proxy-group: dev-ingress
    tailscale.com/tags: tag:k8s-dev
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - workshop-app
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workshop-app
                port:
                  number: 80
