apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-app
  namespace: dev
  labels:
    app.kubernetes.io/name: workshop-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workshop-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: workshop-app
      containers:
        - name: app
          image: ghcr.io/OWNER/REPO:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workshop-app
  namespace: dev
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workshop-app
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-app
  namespace: dev
  labels:
    app.kubernetes.io/name: workshop-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workshop-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workshop-app
  namespace: dev
  annotations:
    tailscale.com/proxy-group: dev-ingress
    tailscale.com/tags: tag:k8s-dev
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - workshop-app
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workshop-app
                port:
                  number: 80
