name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
      - name: Join the tailnet as tag:ci-deployer
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:ci-deployer
      - name: Use the kubeconfig DevOps handed out
        run: echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"
      - name: Apply k8s/ with the built image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          ls k8s/*.yaml >/dev/null 2>&1 || { echo "::notice::No k8s/ manifests yet; nothing to deploy."; exit 0; }
          yq '(select(.kind == "StatefulSet" or .kind == "Deployment") | .spec.template.spec.containers[].image) = strenv(IMAGE)' k8s/*.yaml > rendered.yaml
          kubectl apply --validate=false -f rendered.yaml
          for w in $(kubectl get statefulset,deployment -o name); do
            kubectl rollout status "$w" --timeout=5m
          done
          kubectl get pods,ingress -o wide
