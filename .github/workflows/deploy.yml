name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: dev-kartik
  cancel-in-progress: false

env:
  NAMESPACE: dev-kartik
  PAM_SERVICE: kb-gke-dev

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
      - name: Join the tailnet as tag:ci-deployer
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:ci-deployer
      - name: Point kubectl at the PAM Kubernetes service
        run: |
          kubectl config set-cluster pam --server="http://${PAM_SERVICE}"
          kubectl config set-credentials pam
          kubectl config set-context pam --cluster=pam --user=pam --namespace="${NAMESPACE}"
          kubectl config use-context pam
      - name: Apply k8s/ with the built image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          yq '(select(.kind == "StatefulSet" or .kind == "Deployment") | .spec.template.spec.containers[].image) = strenv(IMAGE)' k8s/*.yaml > rendered.yaml
          kubectl apply -f rendered.yaml
          for w in $(kubectl get statefulset,deployment -o name); do
            kubectl rollout status "$w" --timeout=5m
          done
          kubectl get pods -o wide
