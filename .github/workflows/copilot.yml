name: Copilot agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  copilot:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/copilot') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @github/copilot
      - name: Join the tailnet as tag:ci-agent
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_AGENT_CLIENT_ID }}
          audience: ${{ vars.TS_AGENT_AUDIENCE }}
          tags: tag:ci-agent
      - name: Run Copilot CLI through Aperture
        env:
          COPILOT_OFFLINE: "true"
          COPILOT_PROVIDER_TYPE: anthropic
          COPILOT_PROVIDER_BASE_URL: ${{ vars.APERTURE_URL }}
          COPILOT_PROVIDER_API_KEY: not-needed
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          git switch -c "copilot/issue-${{ github.event.issue.number }}"
          copilot --allow-all-tools --no-ask-user -p "$(printf 'Work on this issue and change files in the repository. Do not commit.\n\nTitle: %s\n\n%s\n\nRequest: %s' "$ISSUE_TITLE" "$ISSUE_BODY" "$COMMENT")"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$ISSUE_TITLE"
          git push -u origin HEAD
          gh pr create --fill --body "Closes #${{ github.event.issue.number }}. Generated by Copilot CLI through Aperture."
