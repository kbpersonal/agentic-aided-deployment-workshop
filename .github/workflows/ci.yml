name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: docker build --tag workshop-app:${{ github.sha }} .
      - name: Validate manifests
        if: hashFiles('k8s/**') != ''
        run: |
          for f in k8s/*.yaml; do
            yq -e 'select(.metadata.namespace != "dev-kartik")' "$f" >/dev/null 2>&1 \
              && { echo "::error file=$f::every object must be in namespace dev-kartik"; exit 1; }
          done
          yq -e 'select(.apiVersion == null or .kind == null or .metadata.name == null)' k8s/*.yaml >/dev/null 2>&1 \
            && { echo "::error::every object needs apiVersion, kind and metadata.name"; exit 1; }
          yq -e 'select(.kind | test("^(Namespace|ServiceAccount|Role|RoleBinding|ClusterRole|ClusterRoleBinding|Ingress)$"))' k8s/*.yaml >/dev/null 2>&1 \
            && { echo "::error::k8s/ must not create cluster or RBAC objects"; exit 1; }
          true
